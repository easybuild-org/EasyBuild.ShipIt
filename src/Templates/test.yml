# Build and test your project on every pull request, and on every push to the main branch.
#
# The "easybuild-shipit.yml" workflow waits for this one to succeed before preparing a release,
# so if you rename this workflow, remember to update the "workflows" filter over there as well.
name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Adapt this step to how your project builds and runs its tests.
      - name: Build and test
        run: dotnet test
